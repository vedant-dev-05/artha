<body class="bg-light-surface text-light-on-surface font-body antialiased">
  <div class="min-h-[884px] max-w-[390px] mx-auto bg-light-surface flex flex-col" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Focused Top Bar -->
    <header class="px-4 pt-5 pb-3 flex items-center gap-3">
      <a href="../expense-dashboard/ExpenseDashboard.html" data-component-id="button-icon" data-component-type="button" data-component-variant="icon" aria-label="Back to Expense Dashboard" class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-light-surface-container-lowest border border-light-outline-variant/70 text-light-on-surface hover:bg-light-surface-container-low transition-colors duration-state-change shrink-0">

      </a>
      <div>
        <h1 class="font-headline text-headline-md text-light-on-surface leading-tight" data-design-text-token="headline-md">Add expense</h1>
        <p class="font-body text-body-md text-light-on-surface-variant" data-design-text-token="body-md">Quick manual entry · Marked as Manual</p>
      </div>
    </header>

    <!-- Main Form -->
    <main class="flex-1 px-4 pb-20 flex flex-col gap-5">

      <!-- Save Confirmation Banner -->
      <div id="entry-toast" class="hidden rounded-lg bg-success-container text-on-success-container p-3.5 flex items-center justify-between gap-2">

        </div>
        <a href="../expense-dashboard/ExpenseDashboard.html" class="font-label text-label-md underline" data-design-text-token="label-md">View</a>
      </div>

      <form id="expense-form" class="flex flex-col gap-4">
        <!-- Amount -->
        <label class="w-full flex flex-col gap-1">
          <span class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">Amount</span>
          <div class="relative flex items-center">
            <span class="absolute left-4 font-headline text-headline-md text-light-on-surface-variant" aria-hidden="true">₹</span>
            <input type="text" placeholder="0" value="340" inputmode="numeric" class="w-full rounded-lg bg-light-surface-container-lowest border border-light-outline-variant pl-10 pr-4 py-3.5 font-display text-display-lg-mobile text-light-on-surface tabular-nums focus:border-light-primary focus:ring-1 focus:ring-light-primary">
          </div>
        </label>

        <!-- Merchant or Description -->
        <label class="w-full flex flex-col gap-1">
          <span class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">Merchant or description</span>
          <input type="text" placeholder="e.g., Third Wave Coffee" value="Third Wave Coffee" class="w-full rounded-md bg-light-surface-container-lowest border border-light-outline-variant px-4 py-3 font-body text-body-lg text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
        </label>

        <!-- Category Quick Chips -->
        <div class="flex flex-col gap-2">
          <span class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">Category</span>
          <div class="flex flex-wrap gap-2">
            <button type="button" class="entry-cat px-3 py-1.5 rounded-full bg-light-primary text-light-on-primary font-label text-label-md" data-design-text-token="label-md">Food &amp; dining</button>
            <button type="button" class="entry-cat px-3 py-1.5 rounded-full bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface font-label text-label-md" data-design-text-token="label-md">Transport</button>
            <button type="button" class="entry-cat px-3 py-1.5 rounded-full bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface font-label text-label-md" data-design-text-token="label-md">Shopping</button>
            <button type="button" class="entry-cat px-3 py-1.5 rounded-full bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface font-label text-label-md" data-design-text-token="label-md">Entertainment</button>
            <button type="button" class="entry-cat px-3 py-1.5 rounded-full bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface font-label text-label-md" data-design-text-token="label-md">Education</button>
            <button type="button" class="entry-cat px-3 py-1.5 rounded-full bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface font-label text-label-md" data-design-text-token="label-md">Bills</button>
            <button type="button" class="entry-cat px-3 py-1.5 rounded-full bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface font-label text-label-md" data-design-text-token="label-md">Health</button>
            <button type="button" class="entry-cat px-3 py-1.5 rounded-full bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface font-label text-label-md" data-design-text-token="label-md">Other</button>
          </div>
        </div>

        <!-- Date -->
        <label class="w-full flex flex-col gap-1">
          <span class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">Date</span>
          <input type="text" value="21 Nov 2026" class="w-full rounded-md bg-light-surface-container-lowest border border-light-outline-variant px-4 py-3 font-mono text-mono-md text-light-on-surface tabular-nums focus:border-light-primary focus:ring-1 focus:ring-light-primary">
        </label>

        <!-- Optional Notes -->
        <label class="w-full flex flex-col gap-1">
          <span class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">Notes (optional)</span>
          <textarea rows="2" placeholder="Add a quick note..." class="w-full rounded-md bg-light-surface-container-lowest border border-light-outline-variant px-4 py-2.5 font-body text-body-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">Client catch-up coffee</textarea>
        </label>

        <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full mt-2 inline-flex items-center justify-center px-6 py-3 rounded-full bg-light-primary text-light-on-primary font-label text-label-lg hover:bg-light-primary-container transition-colors duration-state-change">
          <span data-design-text-token="label-lg">Save expense</span>
        </button>
      </form>

    </main>

    <!-- Persistent Floating AI Companion -->
    <div class="fixed bottom-5 left-1/2 -translate-x-1/2 w-full max-w-[390px] px-4 pointer-events-none z-40 flex flex-col items-end gap-2">
      <button type="button" data-companion-open aria-label="Open Artha Coach" class="pointer-events-auto relative inline-flex items-center justify-center w-12 h-12 rounded-full bg-light-surface-container-lowest shadow-md border-2 border-light-primary hover:border-light-primary-container transition-colors duration-state-change">
        <img src="https://lh3.googleusercontent.com/aida/ALJJyrC8ShV9-KLzOZ6ZYwux5KXpei3u0pLHix8lUCVpxOB07QsTcpYmDO-Zt7lnWS2iSril_eaXnhFVA1c2lUlFy-k5U5NndrHOYRcIxqtEJohxRAxSbv-XX3tc_Crf4o15JKeteyNboM7iEapcjZMgxzP30mHFF2IOB3XaUBCU047wJ4P_Oyh6EgGBAnqfxeaCYg7YBLpho59DinsV_HS7hjvbN6GJ_tgDCcemI0MgtmSeYCR4nWj9Sg" alt="Artha Coach" class="w-full h-full object-cover rounded-full">
        <span class="absolute -top-0.5 -right-0.5 w-3 h-3 rounded-full bg-success border-2 border-light-surface-container-lowest" aria-hidden="true"></span>
      </button>
    </div>

    <!-- Expandable Conversational Overlay -->
    <div id="companion-overlay" class="fixed inset-0 z-50 max-w-[390px] mx-auto bg-light-scrim/40 flex flex-col justify-end hidden" role="dialog" aria-modal="true" aria-label="Artha Coach">
      <div class="rounded-t-xl bg-light-surface border-t border-light-outline-variant p-4 flex flex-col gap-3 shadow-lg">
        <header class="flex items-center justify-between gap-2 pb-2 border-b border-light-outline-variant/50">
          <div class="flex items-center gap-2.5">
            <img src="https://lh3.googleusercontent.com/aida/ALJJyrC8ShV9-KLzOZ6ZYwux5KXpei3u0pLHix8lUCVpxOB07QsTcpYmDO-Zt7lnWS2iSril_eaXnhFVA1c2lUlFy-k5U5NndrHOYRcIxqtEJohxRAxSbv-XX3tc_Crf4o15JKeteyNboM7iEapcjZMgxzP30mHFF2IOB3XaUBCU047wJ4P_Oyh6EgGBAnqfxeaCYg7YBLpho59DinsV_HS7hjvbN6GJ_tgDCcemI0MgtmSeYCR4nWj9Sg" alt="Artha Coach" class="w-9 h-9 rounded-full object-cover border border-light-primary/40 shrink-0">
            <div>
              <h2 class="font-title text-title-md text-light-on-surface" data-design-text-token="title-md">Artha Coach</h2>
              <p class="font-label text-label-sm text-light-on-surface-variant" data-design-text-token="label-sm">Context: Manual Expense</p>
            </div>
          </div>
          <button type="button" data-companion-close aria-label="Close coach" class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-light-surface-container-low text-light-on-surface">
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">close</span>
          </button>
        </header>
        <div class="rounded-lg rounded-bl-sm bg-light-surface-container-lowest border border-light-outline-variant/60 p-3">
          <p class="font-body text-body-md text-light-on-surface text-pretty" data-design-text-token="body-md">
            Manual entries are great for cash spends—if you upload a bank CSV later, we&#39;ll keep them separate so nothing is double-counted.
          </p>
        </div>
        <form class="flex items-center gap-2 pt-1">
          <input type="text" placeholder="Ask a question..." class="flex-1 rounded-full bg-light-surface-container-lowest border border-light-outline-variant px-4 py-2 font-body text-body-md text-light-on-surface placeholder:text-light-on-surface-variant focus:border-light-primary focus:ring-1 focus:ring-light-primary">
          <button type="submit" aria-label="Send message" class="inline-flex items-center justify-center w-9 h-9 rounded-full bg-light-primary text-light-on-primary shrink-0">
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">send</span>
          </button>
        </form>
      </div>
    </div>

  </div>
  <script>
    (function () {
      document.querySelectorAll('.entry-cat').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.entry-cat').forEach(function (b) {
            b.className = 'entry-cat px-3 py-1.5 rounded-full bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface font-label text-label-md';
          });
          btn.className = 'entry-cat px-3 py-1.5 rounded-full bg-light-primary text-light-on-primary font-label text-label-md';
        });
      });
      document.getElementById('expense-form').addEventListener('submit', function (e) {
        e.preventDefault();
        document.getElementById('entry-toast').classList.remove('hidden');
      });
      var overlay = document.getElementById('companion-overlay');
      document.querySelectorAll('[data-companion-open]').forEach(function (el) {
        el.addEventListener('click', function () { overlay.classList.remove('hidden'); });
      });
      document.querySelectorAll('[data-companion-close]').forEach(function (el) {
        el.addEventListener('click', function () { overlay.classList.add('hidden'); });
      });
    })();
  </script>
