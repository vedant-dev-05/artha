  <div class="min-h-[884px] max-w-[390px] mx-auto bg-light-surface flex flex-col" data-stitch-vh="min-h-[884px]===min-h-screen">

            <button type="button" data-stage="Working professional" class="stage-btn rounded-md bg-light-surface-container-lowest border border-light-outline-variant px-3 py-2.5 text-left font-label text-label-md text-light-on-surface hover:border-light-primary transition-colors">

      </button>
    </div>

    <!-- Expandable Conversational Overlay -->
    <div id="companion-overlay" class="fixed inset-0 z-50 max-w-[390px] mx-auto bg-light-scrim/40 flex flex-col justify-end hidden" role="dialog" aria-modal="true" aria-label="Artha Coach">

          <div class="flex items-center gap-2.5">

            <div>
              <h2 class="font-title text-title-md text-light-on-surface" data-design-text-token="title-md">Artha Coach</h2>

            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">close</span>
          </button>
        </header>
        <div id="companion-messages" class="flex flex-col gap-2.5 max-h-[240px] overflow-y-auto">

            <p class="font-body text-body-md text-light-on-surface text-pretty" data-design-text-token="body-md">

            </p>

        </div>
        <form id="companion-form" class="flex items-center gap-2 pt-1">

          </button>
        </form>
      </div>
    </div>

  </div>
  <script>
    (function () {
      document.querySelectorAll('.stage-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.stage-btn').forEach(function (b) {
            b.className = 'stage-btn rounded-md bg-light-surface-container-lowest border border-light-outline-variant px-3 py-2.5 text-left font-label text-label-md text-light-on-surface hover:border-light-primary transition-colors';
            b.setAttribute('aria-pressed', 'false');
          });
          btn.className = 'stage-btn rounded-md bg-light-primary border border-light-primary px-3 py-2.5 text-left font-label text-label-md text-light-on-primary transition-colors';
          btn.setAttribute('aria-pressed', 'true');
        });
      });
      document.getElementById('personal-form').addEventListener('submit', function (e) {
        e.preventDefault();
        document.getElementById('save-toast').classList.remove('hidden');
      });
      var overlay = document.getElementById('companion-overlay');
      document.querySelectorAll('[data-companion-open]').forEach(function (el) {
        el.addEventListener('click', function () { overlay.classList.remove('hidden'); });
      });
      document.querySelectorAll('[data-companion-close]').forEach(function (el) {
        el.addEventListener('click', function () { overlay.classList.add('hidden'); });
      });
    })();
  </script>
