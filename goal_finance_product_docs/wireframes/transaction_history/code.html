  <script>
    (function () {
      var editModal = document.getElementById('edit-modal');
      var merchantInput = document.getElementById('edit-merchant');
      document.querySelectorAll('[data-edit-txn]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var parts = btn.getAttribute('data-edit-txn').split('|');
          merchantInput.value = parts[0];
          editModal.classList.remove('hidden');
        });
      });
      document.getElementById('close-edit').addEventListener('click', function () { editModal.classList.add('hidden'); });
      document.getElementById('save-edit').addEventListener('click', function () { editModal.classList.add('hidden'); });
      var overlay = document.getElementById('companion-overlay');
      document.querySelectorAll('[data-companion-open]').forEach(function (el) {
        el.addEventListener('click', function () { overlay.classList.remove('hidden'); });
      });
      document.querySelectorAll('[data-companion-close]').forEach(function (el) {
        el.addEventListener('click', function () { overlay.classList.add('hidden'); });
      });
    })();
  </script>
